# Small-VPS deployment (1 vCPU / 4 GB): prebuilt app + Reel's computer. Caddy (host) proxies to 172.17.0.1:3420.
services:
  desk:
    build: ./desk
    # 3420 → app (Next.js); 3421 → desk WebSocket stream (Caddy routes only /desk/ws there)
    ports: ["172.17.0.1:3420:3000", "172.17.0.1:3421:7900"]
    environment: { DESK_IDLE_MIN: "5", DESK_FPS: "10", DESK_QV: "9", TZ: "Africa/Lagos" }
    init: true
    volumes: ["desk-home:/home/reel/home"]
    shm_size: 256m
    restart: unless-stopped
    mem_limit: 1100m
    cpus: 0.9
  app:
    build: { context: ./app, dockerfile: Dockerfile.prebuilt }
    network_mode: "service:desk"
    env_file: .env
    environment: { DATA_DIR: /data }
    volumes: ["app-data:/data"]
    depends_on: [desk]
    init: true
    restart: unless-stopped
    mem_limit: 700m
    cpus: 0.9
  # HyperFrames (Apache-2.0) shot animator; copy services/hyperframes to ./hf. App falls back to FFmpeg if down.
  hf:
    build: ./hf
    init: true
    restart: unless-stopped
    mem_limit: 1200m
    cpus: 0.8
    cpu_shares: 256
    environment:
      - DATA_DIR=/data
      - HYPERFRAMES_SKIP_SKILLS=1
      - DO_NOT_TRACK=1
    volumes:
      - app-data:/data
    expose:
      - "8100"

volumes:
  app-data:
  desk-home:
